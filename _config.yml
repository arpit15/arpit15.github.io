# Site settings
title: Arpit Agarwal
description: >-
  Senior Robotics Engineer at Dexterity, working on GPU-first reinforcement learning and CUDA
  kernels. Ph.D. in Robotics from Carnegie Mellon University.
author: Arpit Agarwal
email: arpit15945@gmail.com
url: "https://arpit15.github.io"   # hostname + protocol (overridden to localhost by `jekyll serve`)
baseurl: ""                        # subpath, e.g. /personalwebsite for a project site
twitter_username: arpit7t
github_username: arpit15
linkedin_username:                 # the part after linkedin.com/in/; leave empty to hide the link
scholar_id: H8FOdHwAAAAJ

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/
plugins:             # all whitelisted by GitHub Pages
  - jekyll-feed
  - jekyll-seo-tag

kramdown:
  input: GFM
  syntax_highlighter: rouge
  # Default math_engine (mathjax) turns $$..$$ into \(..\) / \[..\], which
  # KaTeX auto-render picks up client-side (see _includes/math.html).
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  toc_levels: 2..3

# These collections are only used as data lists (home + /publications/)
collections:
  company_projects:
    output: false
  research_projects:
    output: false
  projects:
    output: false
  tools:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
      toc: false

exclude:
  - _site/
  - docs/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
